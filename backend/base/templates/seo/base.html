<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WedMangal">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="https://www.wedmangal.com/og-image-1200x630.jpg">
<meta property="og:locale" content="en_IN">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#5e143f">
{% for block in json_ld %}<script type="application/ld+json">{{ block|safe }}</script>
{% endfor %}
<style>
  :root { --plum:#5e143f; --gold:#f9e79f; --ink:#2b2129; --muted:#6b5d66; --line:#eadfe5; --bg:#fbf8f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); line-height:1.55; }
  a { color:var(--plum); }
  .top { background:var(--plum); color:#fff; }
  .top .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 16px; }
  .brand { color:var(--gold); font:700 1.4rem Georgia, serif; text-decoration:none; }
  .top nav a { color:#fff; text-decoration:none; margin-left:16px; font-size:.95rem; }
  .top nav a.cta { background:var(--gold); color:var(--plum); padding:6px 12px; border-radius:18px; font-weight:600; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 16px; }
  main { padding:20px 0 40px; }
  .crumbs { font-size:.85rem; color:var(--muted); margin-bottom:8px; }
  .crumbs a { color:var(--muted); }
  h1 { overflow-wrap:anywhere; font:700 clamp(1.5rem, 4vw, 2.2rem) Georgia, serif; color:var(--plum); margin:.2em 0 .3em; }
  h2 { font:700 1.3rem Georgia, serif; color:var(--plum); margin:1.6em 0 .6em; }
  .lead { color:var(--muted); font-size:1.05rem; max-width:760px; }
  .btn { margin:4px 0; display:inline-block; background:var(--plum); color:#fff; padding:10px 18px; border-radius:22px; text-decoration:none; font-weight:600; }
  .btn.alt { background:#fff; color:var(--plum); border:1px solid var(--plum); }
  .btn.wa { background:#1f8f4e; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; text-decoration:none; color:inherit; display:flex; flex-direction:column; }
  .card img, .card .noimg { width:100%; aspect-ratio:4/3; object-fit:cover; background:#f1e7ec; display:block; }
  .card .body { padding:10px 12px; }
  .card strong { display:block; color:var(--ink); }
  .card small { color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0; list-style:none; }
  .chips a, .chips span { display:inline-block; background:#fff; border:1px solid var(--line); border-radius:18px; padding:6px 12px; text-decoration:none; font-size:.92rem; }
  .steps { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap:14px; padding:0; list-style:none; }
  .steps li { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; }
  details { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:8px; }
  summary { font-weight:600; cursor:pointer; }
  footer { border-top:1px solid var(--line); padding:20px 0 30px; font-size:.9rem; color:var(--muted); }
  footer a { margin-right:14px; }
  @media (max-width:600px) { .top nav a { margin-left:10px; font-size:.88rem; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/">WedMangal</a>
  <nav><a href="/search/">Search</a><a href="/blog">Ideas</a><a class="cta" href="/list-your-business">List your business</a></nav>
</div></header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer><div class="wrap">
  <p>Wedding vendors by city:
  {% for name, slug in cities %}<a href="/{{ slug }}">{{ name }}</a>{% endfor %}</p>
  <p><a href="/">Home</a><a href="/blog">Wedding planning guides</a><a href="/faq">FAQ</a><a href="/ContactUs">Contact us</a><a href="/list-your-business">For vendors</a></p>
</div></footer>
</body>
</html>
